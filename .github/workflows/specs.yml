name: specs
on: workflow_dispatch
jobs:
  s:
    runs-on: windows-2022
    steps:
      - name: specs
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors,MaxClockSpeed | Format-List
          "RAM GB: {0:N1}" -f ((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory/1GB)
          Get-CimInstance Win32_VideoController | Select-Object Name,DriverVersion | Format-List
          "--- mesa present? ---"
          if (Test-Path "$env:SystemRoot\System32\opengl32.dll") { (Get-Item "$env:SystemRoot\System32\opengl32.dll").VersionInfo.FileDescription } else { 'no opengl32' }